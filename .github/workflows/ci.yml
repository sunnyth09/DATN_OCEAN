name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "production", "release/*" ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'face-service/**'
      - 'mysql/**'
      - 'nginx/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main", "production", "release/*" ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'face-service/**'
      - 'mysql/**'
      - 'nginx/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ocean_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot" --health-interval=10s --health-timeout=5s --health-retries=3
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        tools: composer, phpunit
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql, dom, filter, gd, json, pdo, redis
        
    - name: Setup CI Environment
      run: cp .env.testing .env
      
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      
    - name: Generate key
      run: php artisan key:generate
      
    - name: Run Linting (Pint)
      run: ./vendor/bin/pint --test
      continue-on-error: true
      
    - name: Run PHPUnit
      run: php artisan test --env=testing
