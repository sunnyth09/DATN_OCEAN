name: Build and Deploy Laravel + Vue

on:
  push:
    branches:
      - production
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'face-service/**'
      - 'mysql/**'
      - 'nginx/**'
      - 'docker-compose.yml'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_mysql, xml, ctype, json
          coverage: none

      - name: Composer Install (Backend)
        working-directory: ./backend
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --no-dev --optimize-autoloader

      - name: Run Pint (Backend)
        working-directory: ./backend
        run: |
          if [ -f "vendor/bin/pint" ]; then
            echo "Running Laravel Pint..."
            ./vendor/bin/pint --test
          else
            echo "Pint not found, skipping."
          fi

      - name: Run PHPUnit (Backend)
        working-directory: ./backend
        run: |
          if [ -f "phpunit.xml" ] || [ -f "phpunit.xml.dist" ]; then
            echo "Running PHPUnit..."
            php artisan test
          else
            echo "PHPUnit not found, skipping."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: NPM Install (Frontend)
        working-directory: ./frontend
        run: npm ci || npm install

      - name: NPM Build (Frontend)
        working-directory: ./frontend
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./frontend/dist/
          retention-days: 7

      - name: Copy Frontend Build to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          source: "frontend/dist/*"
          target: "${{ secrets.PROJECT_PATH }}/backend/public"
          strip_components: 2

      - name: SSH Deploy (Backend)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            
            # Kéo code mới nhất từ Git
            git pull origin production
            
            cd backend
            # Cài đặt các package PHP (bỏ qua dev)
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # Chạy migrate database
            php artisan migrate --force
            
            # Xóa cache cũ và tạo cache mới
            php artisan optimize:clear
            php artisan optimize
            
            # Kiểm tra và restart Queue/Reverb nếu có
            if php artisan list | grep -q 'queue:restart'; then
              php artisan queue:restart
            fi
            
            if php artisan list | grep -q 'reverb:restart'; then
              php artisan reverb:restart || true
            fi
            
            if php artisan list | grep -q 'horizon:terminate'; then
              php artisan horizon:terminate
            fi
