name: Build and Deploy Laravel + Vue

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
    branches:
      - production

jobs:
  build_and_deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_mysql, xml, ctype, json
          coverage: none

      - name: Composer Install (Backend)
        working-directory: ./backend
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: NPM Install (Frontend)
        working-directory: ./frontend
        run: npm ci || npm install

      - name: NPM Build (Frontend)
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://apiocean.bcbdev.id.vn/api' }}
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL || 'https://apiocean.bcbdev.id.vn' }}
          VITE_API_STORAGE: ${{ vars.VITE_API_STORAGE || 'https://apiocean.bcbdev.id.vn/storage' }}
          VITE_REVERB_HOST: ${{ vars.VITE_REVERB_HOST || 'apiocean.bcbdev.id.vn' }}
          VITE_REVERB_PORT: ${{ vars.VITE_REVERB_PORT || '443' }}
          VITE_REVERB_SCHEME: ${{ vars.VITE_REVERB_SCHEME || 'https' }}
          VITE_REVERB_APP_KEY: ${{ secrets.REVERB_APP_KEY || 'ocean_realtime_key_2024' }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY || '0x4AAAAAADfskJpxs4bqJtS_' }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || '69477374031-v9nattjdc51dj9hb20qntpq6dkqedem8.apps.googleusercontent.com' }}
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./frontend/dist/
          retention-days: 7

      - name: Copy Frontend Build to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "frontend/dist/*"
          target: "/tmp/frontend_dist_${{ github.run_id }}"
          strip_components: 2
          overwrite: true

      - name: SSH Deploy (Backend with Docker)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            
            # 1. Kéo code mới nhất từ Git
            git pull origin production
            
            # 2. Deploy Frontend & Nginx Configs (dùng quyền Docker để không bao giờ cần sudo)
            docker run --rm --privileged -v /:/host -v /tmp/frontend_dist_${{ github.run_id }}:/dist -v $(pwd)/nginx/vps:/repo_vps alpine sh -c "mkdir -p /host/var/www/oceansport/dist && cp -rf /dist/* /host/var/www/oceansport/dist/ && chown -R 33:33 /host/var/www/oceansport/dist && cp -rf /repo_vps/* /host/etc/nginx/sites-available/ 2>/dev/null || true && ln -sf /etc/nginx/sites-available/apiocean.conf /host/etc/nginx/sites-enabled/ 2>/dev/null || true && ln -sf /etc/nginx/sites-available/oceansport.conf /host/etc/nginx/sites-enabled/ 2>/dev/null || true && rm -f /host/etc/nginx/sites-enabled/default"
            rm -rf /tmp/frontend_dist_${{ github.run_id }}
            
            # 3. Reload VPS Nginx để nhận file mới (dùng quyền Docker để không bao giờ cần sudo)
            docker run --rm --privileged --pid=host alpine killall -HUP nginx 2>/dev/null || true
            
            # 4. Cập nhật và chạy lại các container Docker (Backend only)
            docker compose up -d --build
            
            # 5. Xóa các image Docker cũ để giải phóng dung lượng VPS
            docker image prune -f
            
            # THỰC THI CÁC LỆNH LARAVEL BÊN TRONG CONTAINER
            docker compose exec -T backend composer install --no-dev --optimize-autoloader --no-interaction
            
            docker compose exec -T backend php artisan migrate --force
            
            docker compose exec -T backend php artisan optimize:clear
            docker compose exec -T backend php artisan optimize
            
            # Restart các dịch vụ nền
            docker compose exec -T backend php artisan queue:restart || true
            docker compose exec -T backend php artisan reverb:restart || true
            docker compose exec -T backend php artisan horizon:terminate || true