name: Build and Deploy Laravel + Vue

on:
  push:
    branches:
      - production
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'face-service/**'
      - 'mysql/**'
      - 'nginx/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_mysql, xml, ctype, json
          coverage: none

      - name: Composer Install (Backend)
        working-directory: ./backend
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: NPM Install (Frontend)
        working-directory: ./frontend
        run: npm ci || npm install

      - name: NPM Build (Frontend)
        working-directory: ./frontend
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./frontend/dist/
          retention-days: 7

      - name: Copy Frontend Build to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "frontend/dist/*"
          target: "/tmp/frontend_dist_${{ github.run_id }}"
          strip_components: 2
          overwrite: true

      - name: SSH Deploy (Backend with Docker)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            
            # 1. Kéo code mới nhất từ Git trước (để tránh xung đột với các file build static)
            git pull origin production
            
            # 2. Copy bản build frontend từ thư mục tạm vào public của backend
            # Ưu tiên copy trực tiếp, fallback sang sudo hoặc docker compose cp nếu thư mục do container sở hữu
            cp -rf /tmp/frontend_dist_${{ github.run_id }}/* ./backend/public/ 2>/dev/null || sudo cp -rf /tmp/frontend_dist_${{ github.run_id }}/* ./backend/public/ 2>/dev/null || docker compose exec -T backend cp -rf /tmp/frontend_dist_${{ github.run_id }}/* /var/www/public/
            rm -rf /tmp/frontend_dist_${{ github.run_id }}
            
            # 3. Đảm bảo quyền sở hữu file chuẩn xác cho web server / container đọc được
            sudo chown -R $(whoami):$(whoami) ./backend/public 2>/dev/null || true
            docker compose exec -T backend chown -R www-data:www-data /var/www/public 2>/dev/null || true
            
            # 4. Cập nhật và chạy lại các container ngầm định
            docker compose up -d --build
            
            # 5. Xóa các image Docker cũ để giải phóng dung lượng VPS
            docker image prune -f
            
            # THỰC THI CÁC LỆNH LARAVEL BÊN TRONG CONTAINER
            docker compose exec -T backend composer install --no-dev --optimize-autoloader --no-interaction
            
            docker compose exec -T backend php artisan migrate --force
            
            docker compose exec -T backend php artisan optimize:clear
            docker compose exec -T backend php artisan optimize
            
            # Restart các dịch vụ nền
            docker compose exec -T backend php artisan queue:restart || true
            docker compose exec -T backend php artisan reverb:restart || true
            docker compose exec -T backend php artisan horizon:terminate || true