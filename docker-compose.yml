name: ocean

services:
  db:
    image: mysql:8.0
    restart: always
    ports:
      # Bind chỉ localhost — tránh lộ MySQL ra mọi IP của host (0.0.0.0)
      - "127.0.0.1:8306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ocean_db}
      MYSQL_USER: ${DB_ROOT_USER:-oceansport}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M

  redis:
    image: redis:alpine
    restart: always
    deploy:
      resources:
        limits:
          memory: 50M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    expose:
      - "9000"
      - "8383"
    env_file:
      - .env
    environment:
      CACHE_STORE: redis
    volumes:
      - ./backend:/var/www
      - ./.env:/var/www/.env
      - backend_vendor:/var/www/vendor
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$sock = @fsockopen(\"127.0.0.1\", 9000); exit($$sock ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 200M

  queue_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      CACHE_STORE: redis
    volumes:
      - ./backend:/var/www
      - ./.env:/var/www/.env
      - backend_vendor:/var/www/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    deploy:
      resources:
        limits:
          memory: 150M

  nginx_backend:
    image: nginx:alpine
    restart: always
    ports:
      # Bind localhost — VPS host Nginx sẽ reverse proxy vào port này
      - "127.0.0.1:8383:8383"
    volumes:
      - ./nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www:ro
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 50M

  meilisearch:
    image: getmeili/meilisearch:v1.7
    restart: always
    ports:
      # Bind chỉ localhost — Meilisearch không nên lộ ra internet (nhất là khi master key còn để mặc định)
      - "127.0.0.1:7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-masterKey}
      MEILI_ENV: development
    volumes:
      - meilisearch_data:/meili_data
    deploy:
      resources:
        limits:
          memory: 200M

  # Frontend dev server — CHỈ dùng cho local development
  # Production: CI/CD build ra file tĩnh, VPS Nginx serve trực tiếp
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build-stage
    restart: always
    profiles: [dev]  # Chỉ khởi động khi chạy: docker compose --profile dev up
    ports:
      - "3302:3302"
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./.env:/app/.env
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3302"

  # FACE VERIFICATION SERVICE (Python + dlib)
  face-service:
    build:
      context: ./face-service
      dockerfile: Dockerfile
    container_name: ocean_face_service
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      - FACE_TOLERANCE=0.45
      - MAX_ENCODINGS_PER_REQUEST=10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 300M

volumes:
  mysql_data:
  meilisearch_data:
  backend_vendor:
