name: ocean

services:
  db:
    image: mysql:8.0
    restart: always
    ports:
      - "8306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ocean_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    expose:
      - "9000"
    env_file:
      - .env
    environment:
      CACHE_STORE: redis
    volumes:
      - ./backend:/var/www
      - ./.env:/var/www/.env
      - backend_vendor:/var/www/vendor
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$sock = @fsockopen(\"127.0.0.1\", 9000); exit($$sock ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s

  nginx_backend:
    image: nginx:alpine
    restart: always
    ports:
      - "0.0.0.0:8383:8383"
    volumes:
      - ./nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www:ro
    depends_on:
      backend:
        condition: service_healthy

  meilisearch:
    image: getmeili/meilisearch:v1.7
    restart: always
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-masterKey}
      MEILI_ENV: development
    volumes:
      - meilisearch_data:/meili_data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build-stage
    restart: always
    ports:
      - "3302:3302"
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./.env:/app/.env
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3302"

volumes:
  mysql_data:
  meilisearch_data:
  backend_vendor:
