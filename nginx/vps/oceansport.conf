# ==============================================================================
# VPS Host Nginx — Frontend SPA: oceansport.pro.vn
# ==============================================================================
# LƯU Ý QUAN TRỌNG: CI/CD copy file này bằng `cp -rn` (no-clobber) — nghĩa là
# NẾU FILE ĐÃ TỒN TẠI TRÊN VPS THÌ SẼ KHÔNG BỊ GHI ĐÈ. Đây là chủ ý, để không
# làm mất block SSL `listen 443` mà Certbot đã tự thêm vào file trên VPS.
#
# => HỆ QUẢ: Mọi thay đổi trong file này sẽ KHÔNG tự động áp dụng lên VPS.
#    Chính sách cache đã được tách ra file snippets/spa-cache.conf (file đó ĐƯỢC
#    ghi đè mỗi lần deploy). Muốn sửa cache → sửa spa-cache.conf, không sửa đây.
#
# Cài đặt lần đầu trên VPS:
#   sudo mkdir -p /var/www/oceansport/dist
#   sudo cp oceansport.conf /etc/nginx/sites-available/oceansport.conf
#   sudo mkdir -p /etc/nginx/snippets && sudo cp snippets/spa-cache.conf /etc/nginx/snippets/
#   sudo ln -sf /etc/nginx/sites-available/oceansport.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d oceansport.pro.vn
#
# Sau khi Certbot tạo block 443, PHẢI thêm dòng `include snippets/spa-cache.conf;`
# vào cả block 443 đó (xem lệnh migrate một lần trong docs/github-actions.md).
# ==============================================================================

server {
    listen 80;
    server_name oceansport.pro.vn;

    # Thư mục chứa file tĩnh (CI/CD copy frontend/dist vào đây)
    root /var/www/oceansport/dist;
    index index.html;

    charset utf-8;

    # Toàn bộ location + chính sách cache nằm trong snippet dùng chung.
    include snippets/spa-cache.conf;

    # ── Certbot sẽ tự thêm block SSL (listen 443) khi chạy ──
    # Nhớ thêm `include snippets/spa-cache.conf;` vào block 443 đó nữa!
}
