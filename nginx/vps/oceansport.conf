# ==============================================================================
# VPS Host Nginx — Frontend SPA: oceansport.bcbdev.id.vn
# ==============================================================================
# Copy file này lên VPS:
#   sudo mkdir -p /var/www/oceansport/dist
#   sudo cp oceansport.conf /etc/nginx/sites-available/oceansport.conf
#   sudo ln -sf /etc/nginx/sites-available/oceansport.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d oceansport.bcbdev.id.vn
# ==============================================================================

server {
    listen 80;
    server_name oceansport.bcbdev.id.vn;

    # Thư mục chứa file tĩnh (CI/CD copy frontend/dist vào đây)
    root /var/www/oceansport/dist;
    index index.html;

    charset utf-8;

    # ── Vue Router SPA fallback ──
    # Mọi route không khớp file thật → trả về index.html để Vue Router xử lý
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache file tĩnh (JS, CSS, ảnh) ──
    # Vite build ra filename có hash → cache dài hạn an toàn
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Bảo mật: chặn truy cập file ẩn ──
    location ~ /\. {
        deny all;
    }

    # ── Certbot sẽ tự thêm block SSL (listen 443) khi chạy ──
}
