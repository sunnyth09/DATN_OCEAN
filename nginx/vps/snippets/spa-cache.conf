# ==============================================================================
# SPA Cache Policy — snippet dùng chung cho frontend SPA (oceansport)
# ==============================================================================
# File này ĐƯỢC CI/CD GHI ĐÈ mỗi lần deploy (khác với oceansport.conf dùng cp -rn
# để bảo vệ block SSL 443 do Certbot tạo). Nhờ vậy mọi thay đổi về chính sách
# cache luôn được áp dụng lên VPS mà không rủi ro mất cấu hình HTTPS.
#
# Cách dùng — thêm dòng sau vào TRONG server block (cả block 80 và block 443):
#   include snippets/spa-cache.conf;
# ==============================================================================

# ── index.html: TUYỆT ĐỐI không cache ──
# Đây là mấu chốt chống "deploy xong vẫn thấy giao diện cũ": index.html là file
# duy nhất không có hash trong tên, nên nếu browser cache nó thì browser sẽ mãi
# tham chiếu tới các JS/CSS chunk hash CŨ, dù server đã có bản mới.
location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    etag off;
    if_modified_since off;
}

# ── Vite build assets: cache vĩnh viễn (an toàn vì filename có content hash) ──
# Đặt TRƯỚC location / để regex được ưu tiên đúng thứ tự mong muốn.
location ~* ^/assets/.*\.(js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|avif|map)$ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    access_log off;
    try_files $uri =404;
}

# ── File tĩnh ngoài /assets (favicon, ảnh trong public/) ──
# Không có content hash → cache ngắn + phải revalidate.
location ~* \.(png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|eot)$ {
    expires 1h;
    add_header Cache-Control "public, must-revalidate" always;
    access_log off;
}

# ── Vue Router SPA fallback ──
# Mọi route không khớp file thật → index.html. Response này cũng không được cache.
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}

# ── Bảo mật: chặn truy cập file ẩn ──
location ~ /\. {
    deny all;
}
