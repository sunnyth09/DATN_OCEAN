# ==============================================================================
# VPS Host Nginx — Backend API: apiocean.bcbdev.id.vn
# ==============================================================================
# Copy file này lên VPS:
#   sudo cp apiocean.conf /etc/nginx/sites-available/apiocean.conf
#   sudo ln -sf /etc/nginx/sites-available/apiocean.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d apiocean.bcbdev.id.vn
# ==============================================================================

server {
    listen 80;
    server_name apiocean.bcbdev.id.vn;

    # Upload file lớn (ảnh sản phẩm, Excel import)
    client_max_body_size 50M;

    # ── API & Laravel routes ──
    location / {
        proxy_pass http://127.0.0.1:8383;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout cho request nặng (import, AI try-on)
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # ── WebSocket (Laravel Reverb) ──
    # Trình duyệt kết nối wss://apiocean.bcbdev.id.vn/app/...
    location /app {
        proxy_pass http://127.0.0.1:8383;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # ── Certbot sẽ tự thêm block SSL (listen 443) khi chạy ──
}
