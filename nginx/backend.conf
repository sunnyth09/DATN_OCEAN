server {
    listen 8383;
    listen [::]:8383;
    server_name _;

    # Upload file product 50MB
    client_max_body_size 50M;

    root /var/www/public;
    index index.php index.html;

    # Charset
    charset utf-8;

    # ==================== GZIP COMPRESSION ====================
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/plain
        text/xml
        text/javascript
        image/svg+xml;

    # ==================== LOGGING ====================
    # Tắt access log cho static files → giảm I/O disk
    access_log /var/log/nginx/backend_access.log;
    error_log  /var/log/nginx/backend_error.log;

    # ==================== STATIC FILES CACHE ====================
    # Cache ảnh, CSS, JS tĩnh → trình duyệt không cần tải lại
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ==================== LARAVEL SPA ROUTING ====================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ==================== DOCKER DNS RESOLVER ====================
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ==================== WEBSOCKET (REVERB) ====================
    location /app {
        set $reverb_upstream "http://reverb:8383";
        proxy_pass             $reverb_upstream;
        proxy_set_header Host  $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout     3600;
        proxy_connect_timeout  60;
        proxy_send_timeout     3600;

        # Bật cấu hình Upgrade để nâng cấp lên WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }

    # ==================== MEILISEARCH PROXY ====================
    # Frontend gọi tìm kiếm qua https://api.oceansport.pro.vn/meilisearch/
    # thay vì truy cập trực tiếp MeiliSearch container (không public)
    location /meilisearch/ {
        rewrite ^/meilisearch/(.*)$ /$1 break;
        proxy_pass http://meilisearch:7700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==================== PHP-FPM FASTCGI ====================
    location ~ \.php$ {

        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Đảm bảo PHP-FPM nhận đúng Content-Type và Content-Length từ request
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param HTTP_ACCEPT $http_accept;

        # Buffer lớn hơn → tránh ghi temp file khi response lớn
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 32k;

        # Timeout cho request nặng (import Excel up to 10.000 rows)
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    # ==================== SECURITY ====================
    location ~ /\.ht {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}
